{% extends "base.html" %} {% block title %}SecureStream | Регистрация{% endblock
%} {% block content %}
<div style="max-width: 400px; margin: 0 auto">
	<h1 style="text-align: center; margin-bottom: 2rem">Регистрация</h1>
	<form
		id="registerForm"
		style="display: flex; flex-direction: column; gap: 1rem"
	>
		<div>
			<label for="username" style="display: block; margin-bottom: 0.5rem"
				>Имя пользователя</label
			>
			<input
				type="text"
				id="username"
				name="username"
				required
				style="
					width: 100%;
					padding: 0.75rem;
					border: 1px solid rgba(255, 255, 255, 0.25);
					background: rgba(15, 23, 42, 0.5);
					color: var(--text);
					border-radius: 8px;
					font-size: 1rem;
				"
			/>
		</div>
		<div>
			<label for="password" style="display: block; margin-bottom: 0.5rem"
				>Пароль</label
			>
			<input
				type="password"
				id="password"
				name="password"
				required
				style="
					width: 100%;
					padding: 0.75rem;
					border: 1px solid rgba(255, 255, 255, 0.25);
					background: rgba(15, 23, 42, 0.5);
					color: var(--text);
					border-radius: 8px;
					font-size: 1rem;
				"
			/>
		</div>
		<div>
			<label for="passwordConfirm" style="display: block; margin-bottom: 0.5rem"
				>Подтвердите пароль</label
			>
			<input
				type="password"
				id="passwordConfirm"
				name="passwordConfirm"
				required
				style="
					width: 100%;
					padding: 0.75rem;
					border: 1px solid rgba(255, 255, 255, 0.25);
					background: rgba(15, 23, 42, 0.5);
					color: var(--text);
					border-radius: 8px;
					font-size: 1rem;
				"
			/>
		</div>
		<div
			id="error"
			style="color: #ef4444; display: none; font-size: 0.9rem"
		></div>
		<button
			type="submit"
			style="
				border: none;
				background: var(--accent);
				color: #fff;
				padding: 0.95rem 1.75rem;
				margin-top: 0.5rem;
			"
		>
			Зарегистрироваться
		</button>
		<div style="text-align: center; margin-top: 1rem">
			<a href="{{ url_for('login_page') }}" style="color: var(--accent)"
				>Уже есть аккаунт? Войти</a
			>
		</div>
	</form>
</div>

<script>
	document
		.getElementById('registerForm')
		.addEventListener('submit', async e => {
			e.preventDefault()
			const errorDiv = document.getElementById('error')
			errorDiv.style.display = 'none'

			const username = document.getElementById('username').value
			const password = document.getElementById('password').value
			const passwordConfirm = document.getElementById('passwordConfirm').value

			if (password !== passwordConfirm) {
				errorDiv.textContent = 'Пароли не совпадают'
				errorDiv.style.display = 'block'
				return
			}

			try {
				const response = await fetch('/api/auth/register', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, password }),
				})

				const data = await response.json()

				if (!response.ok) {
					errorDiv.textContent = data.error || 'Ошибка регистрации'
					errorDiv.style.display = 'block'
					return
				}

				// Сохраняем токен в localStorage
				localStorage.setItem('access_token', data.access_token)

				// Перенаправляем на главную
				window.location.href = '/'
			} catch (error) {
				errorDiv.textContent = 'Ошибка соединения с сервером'
				errorDiv.style.display = 'block'
			}
		})
</script>
{% endblock %}
